<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>投资研报 | GARCH QUANT</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Serif+SC:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/style.css">
  <style>
    :root, [data-theme="light"] {
      --text-xs: clamp(0.75rem, 0.7rem + 0.25vw, 0.875rem);
      --text-sm: clamp(0.875rem, 0.8rem + 0.35vw, 1rem);
      --text-base: clamp(1rem, 0.95rem + 0.25vw, 1.125rem);
      --text-lg: clamp(1.125rem, 1rem + 0.75vw, 1.5rem);
      --text-xl: clamp(1.5rem, 1.2rem + 1.25vw, 2.25rem);
      --text-2xl: clamp(2rem, 1.2rem + 2.5vw, 3.5rem);
      --space-1: 0.25rem; --space-2: 0.5rem; --space-3: 0.75rem;
      --space-4: 1rem; --space-5: 1.25rem; --space-6: 1.5rem;
      --space-8: 2rem; --space-10: 2.5rem; --space-12: 3rem;
      --space-16: 4rem; --space-20: 5rem; --space-24: 6rem;
      --color-bg: #f7f6f2; --color-surface: #f9f8f5;
      --color-surface-offset: #f3f0ec; --color-surface-offset-2: #edeae5;
      --color-divider: #dcd9d5; --color-border: #d4d1ca;
      --color-text: #28251d; --color-text-muted: #6f6d68;
      --color-text-faint: #9e9b96; --color-text-inverse: #f9f8f4;
      --color-primary: #01696f; --color-primary-hover: #0c4e54;
      --color-primary-highlight: #d9ece7; --color-warning: #964219;
      --color-success: #437a22;
      --shadow-sm: 0 1px 2px rgba(34,27,20,0.06);
      --shadow-md: 0 10px 30px rgba(34,27,20,0.08);
      --shadow-lg: 0 20px 44px rgba(34,27,20,0.14);
      --radius-sm: 0.375rem; --radius-md: 0.75rem;
      --radius-lg: 1rem; --radius-xl: 1.5rem; --radius-full: 9999px;
      --content-default: 1120px;
      --font-display: 'Noto Serif SC', Georgia, serif;
      --font-body: 'Inter', system-ui, sans-serif;
      --transition-interactive: 180ms cubic-bezier(0.16, 1, 0.3, 1);
    }
    [data-theme="dark"] {
      --color-bg: #171614; --color-surface: #1c1b19;
      --color-surface-2: #201f1d; --color-surface-offset: #22201e;
      --color-surface-offset-2: #2a2826; --color-divider: #2b2927;
      --color-border: #393735; --color-text: #d7d5d1;
      --color-text-muted: #a5a29e; --color-text-faint: #7c7975;
      --color-text-inverse: #1e1c1a;
      --color-primary: #4f98a3; --color-primary-hover: #66aab4;
      --color-primary-highlight: #283739;
      --shadow-sm: 0 1px 2px rgba(0,0,0,0.22);
      --shadow-md: 0 10px 30px rgba(0,0,0,0.28);
      --shadow-lg: 0 20px 44px rgba(0,0,0,0.38);
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { min-height: 100dvh; font-family: var(--font-body); font-size: var(--text-base); line-height: 1.7; color: var(--color-text); background: radial-gradient(circle at top right, rgba(1,105,111,0.08), transparent 30%), linear-gradient(180deg, var(--color-bg), var(--color-surface)); }
    a { color: inherit; text-decoration: none; transition: color var(--transition-interactive); }
    p { color: var(--color-text-muted); }
    h1, h2, h3 { color: var(--color-text); line-height: 1.15; }
    h1, h2 { font-family: var(--font-display); }
    .container { width: min(calc(100% - 2rem), var(--content-default)); margin-inline: auto; }
    .topbar { position: sticky; top: 0; z-index: 50; backdrop-filter: blur(16px); background: color-mix(in srgb, var(--color-bg) 84%, transparent); border-bottom: 1px solid color-mix(in srgb, var(--color-text) 10%, transparent); }
    .topbar-inner { display: flex; align-items: center; justify-content: space-between; gap: var(--space-4); min-height: 4.5rem; }
    .brand { display: inline-flex; align-items: center; gap: var(--space-3); font-weight: 700; }
    .brand-mark { width: 2rem; height: 2rem; border-radius: 0.7rem; display: grid; place-items: center; color: var(--color-primary); background: color-mix(in srgb, var(--color-primary) 12%, var(--color-surface)); border: 1px solid color-mix(in srgb, var(--color-primary) 16%, transparent); box-shadow: var(--shadow-sm); }
    .top-actions { display: flex; align-items: center; gap: var(--space-3); }
    .theme-toggle, .ghost-btn { min-width: 44px; min-height: 44px; border-radius: var(--radius-full); border: 1px solid color-mix(in srgb, var(--color-text) 12%, transparent); background: color-mix(in srgb, var(--color-surface) 82%, transparent); color: var(--color-text); display: inline-flex; align-items: center; justify-content: center; gap: var(--space-2); padding: 0 var(--space-4); cursor: pointer; transition: all var(--transition-interactive); font-size: var(--text-sm); font-weight: 600; }
    .ghost-btn:hover, .theme-toggle:hover { background: var(--color-surface-offset); transform: translateY(-1px); }
    .page-hero { padding: clamp(var(--space-12), 9vw, var(--space-24)) 0 var(--space-10); }
    .page-hero h1 { font-size: var(--text-2xl); letter-spacing: -0.03em; margin-bottom: var(--space-4); }
    .page-hero p { font-size: var(--text-lg); color: var(--color-text); max-width: 60ch; }
    .reports-grid { display: grid; gap: var(--space-6); padding-bottom: var(--space-24); }
    .report-card {
      display: grid; gap: var(--space-4); grid-template-columns: auto 1fr auto;
      align-items: center; padding: var(--space-6);
      background: color-mix(in srgb, var(--color-surface) 92%, transparent);
      border: 1px solid color-mix(in srgb, var(--color-text) 10%, transparent);
      border-radius: var(--radius-xl); box-shadow: var(--shadow-md);
      transition: all var(--transition-interactive);
    }
    .report-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-lg); border-color: color-mix(in srgb, var(--color-primary) 30%, transparent); }
    .report-icon { width: 3rem; height: 3rem; border-radius: var(--radius-lg); display: grid; place-items: center; font-size: 1.5rem; background: color-mix(in srgb, var(--color-primary) 12%, var(--color-surface)); color: var(--color-primary); border: 1px solid color-mix(in srgb, var(--color-primary) 16%, transparent); flex-shrink: 0; }
    .report-info h3 { font-size: var(--text-lg); margin-bottom: var(--space-2); }
    .report-info p { font-size: var(--text-sm); max-width: none; }
    .report-tags { display: flex; flex-wrap: wrap; gap: var(--space-2); margin-top: var(--space-2); }
    .tag { display: inline-flex; align-items: center; min-height: 1.5rem; padding: 0 var(--space-3); border-radius: var(--radius-full); background: color-mix(in srgb, var(--color-primary) 10%, var(--color-surface)); color: var(--color-primary); font-size: var(--text-xs); font-weight: 700; letter-spacing: 0.04em; border: 1px solid color-mix(in srgb, var(--color-primary) 12%, transparent); }
    .report-link { display: inline-flex; align-items: center; gap: var(--space-2); padding: var(--space-3) var(--space-5); border-radius: var(--radius-full); background: var(--color-primary); color: white; font-size: var(--text-sm); font-weight: 700; transition: all var(--transition-interactive); white-space: nowrap; }
    .report-link:hover { background: var(--color-primary-hover); transform: translateY(-1px); }
    @media (max-width: 720px) { .report-card { grid-template-columns: 1fr; } .report-link { width: fit-content; } }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="container topbar-inner">
      <div class="brand">
        <div class="brand-mark"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 18L10 6l4 8 2-4 4 8"/><path d="M4 18h16"/></svg></div>
        <a href="/" style="color:inherit;">GARCH QUANT</a>
        <span style="color:var(--color-text-faint);font-size:var(--text-sm);font-weight:600;">Institutional Research</span>
      </div>
      <div class="top-actions">
        <a class="ghost-btn" href="/">首页</a>
        <a class="ghost-btn" href="/tools/">工具</a>
        <a class="ghost-btn" href="/report/" style="color:var(--color-primary);">研报</a>
        <button class="theme-toggle" type="button" data-theme-toggle aria-label="切换深色模式"></button>
      </div>
    </div>
  </header>

  <main>
    <section class="page-hero">
      <div class="container">
        <h1>投资研报</h1>
        <p>GARCH QUANT 机构研究 — 波动率建模、宏观研判与量化信号精选</p>
      </div>
    </section>

    <div class="container reports-grid" style="padding-top: var(--space-6);">
      <a href="/report/rklb.html" class="report-card">
        <div class="report-icon">🚀</div>
        <div class="report-info">
          <h3>Rocket Lab (RKLB) 完整投资研报</h3>
          <p>高弹性成长股框架：四条主线监测、价位决策表、仓位管理与情景分析</p>
          <div class="report-tags">
            <span class="tag">成长验证</span><span class="tag">Neutron 催化</span><span class="tag">价位执行</span>
          </div>
        </div>
        <div class="report-link">查看研报 →</div>
      </a>
    </div>
  </main>

  <script>
    (function () {
      const toggle = document.querySelector('[data-theme-toggle]');
      const root = document.documentElement;
      let mode = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      root.setAttribute('data-theme', mode);
      function renderIcon() {
        const isDark = root.getAttribute('data-theme') === 'dark';
        toggle.setAttribute('aria-label', isDark ? '切换浅色模式' : '切换深色模式');
        toggle.innerHTML = isDark
          ? '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"></circle><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"></path></svg>'
          : '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>';
      }
      renderIcon();
      toggle.addEventListener('click', function () {
        mode = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
        root.setAttribute('data-theme', mode);
        renderIcon();
      });
    })();
  </script>
</body>
</html>
