title: GARCH Quant Library
description: >
  GARCH波动率模型 · 时序量化 · 全球市场资产研究 · AI算力产业
  专属专业资料库
url: "https://lib.garch.space"
baseurl: ""
author:
  name: GARCH Quant Research
  email: research@garch.space
repository: GARCH-Quant/quant-library
timezone: Asia/Shanghai

# Build settings
markdown: kramdown
highlighter: rouge
kramdown:
  math_engine: katex
  syntax_highlighter: rouge
  input: GFM
  auto_ids: true
  toc_levels: 1..6

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
  - github-pages

# Collections
collections:
  docs:
    output: true
    permalink: /docs/:path/
  paper:
    output: true
    permalink: /paper/:path/
  strategy:
    output: true
    permalink: /strategy/:path/
  datasets:
    output: true
    permalink: /data/:path/

# Defaults
defaults:
  -
    scope:
      path: ""
    values:
      layout: default
      author: "GARCH Quant Research"
      category: "research"
      tags: ["quantitative-finance", "garch"]
      abstract: ""

# Search
search_full_content: true
search_provider: lunr

# Minify (optional)
compress_html:
  clippings: all
  comments: all
  endings: all
  startings: []
  remove_intertag_spaces: false
  tags:
    - pre
    - textarea
