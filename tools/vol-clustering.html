  <meta name="description" content="BDS 检验、波动率聚集效应量化、ARCH LM 检验">

<body>
  <header class="site-nav">
    <div class="nav-inner">
      <a href="/" class="nav-logo">
        <span class="logo-icon">Σ</span>
        <span class="logo-text">GARCH <span class="logo-accent">ToolBox</span></span>

      <nav class="nav-links">
        <a href="/" class="nav-link">首页</a>

        <button class="theme-toggle" id="themeToggle" aria-label="切换主题"><span class="theme-icon">◐</span></button>
      </nav>
    </div>
  </header>

  <main class="tool-page">
    <div class="tool-page-header">
      <h1 class="tool-page-title">⑯ 波动率聚类特征识别工具</h1>
      <p class="tool-page-sub">BDS 检验、波动率聚集效应量化、ARCH LM 检验</p>
    </div>
    <div class="tool-form">
      <div class="form-grid">
        <div class="form-group">
          <label class="form-label">ARCH LM 滞后阶数</label>
          <input type="text" class="form-input" id="param1" value="5" placeholder="1~12">
        </div>
        <div class="form-group">
          <label class="form-label">BDS 滞后阶数 ε</label>
          <input type="text" class="form-input" id="param2" value="2" placeholder="1~5">
        </div>
        <div class="form-group">
          <label class="form-label">样本长度</label>
          <input type="text" class="form-input" id="param3" value="500" placeholder="500">
        </div>
        <div class="form-group">
          <label class="form-label">显著性水平</label>
          <input type="text" class="form-input" id="param4" value="0.05" placeholder="0.05">
        </div>
        <div class="form-group full">
          <label class="form-label">波动率/收益率序列</label>
          <textarea class="form-textarea" id="dataInput" placeholder="0.01,0.02,0.015,0.03,0.018,...">0.012,0.025,0.015,0.040,0.022,0.018,0.035,0.012,0.028,0.016</textarea>
        </div>
      </div>
      <button class="btn-calc" onclick="calculate()">运行计算</button>
      <div class="result-box" id="resultBox">
        <div class="result-label">计算结果</div>
        <div class="result-value" id="resultValue">—</div>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p class="footer-copy">© 2026 GARCH QUANT | Quantitative Financial Tool Platform</p>
      <p class="footer-author">Fuli Yang, Ph.D.</p>
    </div>
  </footer>
  <script src="/assets/js/theme.js"></script>
  <script>
  function calculate() {
    var lag = parseInt(document.getElementById('param1').value) || 5;
    var epsBDS = parseFloat(document.getElementById('param2').value) || 2;
    var nSample = parseInt(document.getElementById('param3').value) || 500;
    var alpha = parseFloat(document.getElementById('param4').value) || 0.05;
    var dataStr = document.getElementById('dataInput').value;

    var raw = dataStr.split(',').map(function(v) { return parseFloat(v.trim()); }).filter(function(v) { return !isNaN(v); });
    var data = raw.length > 0 ? raw : [0.012,0.025,0.015,0.040,0.022,0.018,0.035,0.012,0.028,0.016];
    var n = Math.min(data.length, nSample);

    // 1. ARCH LM 检验
    var sq = [];
    for (var i = 0; i < n; i++) { sq.push(data[i] * data[i]); }
    var X = [], Y = [];
    for (var t = lag; t < n; t++) {
      var row = [1];
      for (var j = 1; j <= lag; j++) { row.push(sq[t - j]); }
      X.push(row);
      Y.push(sq[t]);
    }
    var XtX = [], XtY = [];
    for (var j = 0; j <= lag; j++) {
      XtX.push([]); XtY.push(0);
      for (var k = 0; k <= lag; k++) {
        var s = 0;
        for (var t = 0; t < X.length; t++) { s += X[t][j] * X[t][k]; }
        XtX[j].push(s);
      }
      for (var t = 0; t < X.length; t++) { XtY[j] += X[t][j] * Y[t]; }
    }
    // Gauss消去求beta
    var nCoef = lag + 1;
    var aug = [];
    for (var i = 0; i < nCoef; i++) {
      aug.push([]);
      for (var j = 0; j <= lag; j++) { aug[i].push(XtX[i][j]); }
      aug[i].push(XtY[i]);
    }
    for (var i = 0; i < nCoef; i++) {
      var piv = aug[i][i];
      for (var j = 0; j <= lag + 1; j++) { aug[i][j] /= piv; }
      for (var ii = 0; ii < nCoef; ii++) {
        if (ii !== i) {
          var factor = aug[ii][i];
          for (var j = 0; j <= lag + 1; j++) { aug[ii][j] -= factor * aug[i][j]; }
        }
      }
    }
    var beta = aug.map(function(row) { return row[lag + 1]; });
    // 残差
    var res = [];
    for (var t = 0; t < X.length; t++) {
      var pred = 0;
      for (var j = 0; j <= lag; j++) { pred += beta[j] * X[t][j]; }
      res.push(Y[t] - pred);
    }
    // R²
    var meanY = Y.reduce(function(s, v) { return s + v; }, 0) / Y.length;
    var TSS = Y.reduce(function(s, v) { return s + (v - meanY) * (v - meanY); }, 0);
    var RSS = res.reduce(function(s, v) { return s + v * v; }, 0);
    var R2 = 1 - RSS / TSS;
    var archLM = X.length * R2;
    var archP = 1 - chiSqCDF(archLM, lag);

    // 2. BDS 检验（简化版）
    var m = Math.max(1, Math.floor(epsBDS));
    var C1 = 0, cnt1 = 0;
    for (var i = 0; i < n; i++) {
      for (var j = i + 1; j < n; j++) {
        if (Math.abs(data[i] - data[j]) < 1) { C1++; cnt1++; }
      }
    }
    C1 = cnt1 > 0 ? 2 * C1 / (n * (n - 1)) : 0;
    var Cm = 0, cntm = 0;
    for (var i = 0; i < n - m; i++) {
      for (var j = i + m; j < n; j++) {
        var maxDiff = 0;
        for (var k = 0; k < m; k++) {
          var diff = Math.abs(data[i + k] - data[j + k]);
          if (diff > maxDiff) maxDiff = diff;
        }
        if (maxDiff < epsBDS) { Cm++; cntm++; }
      }
    }
    Cm = cntm > 0 ? 2 * Cm / ((n - m) * (n - m - 1)) : 0;
    var Cp = Math.pow(C1, m);
    var sigBDS = Math.sqrt(4 * Math.pow(C1, 2 * m) * (1 - Cp) * (1 - (2 * m + 1) * Cp));
    var bdsStat = sigBDS > 1e-12 ? Math.sqrt(n) * (Cm - Cp) / sigBDS : 0;
    var bdsP = 2 * (1 - normCDF(Math.abs(bdsStat)));

    // 3. Ljung-Box Q 统计量
    var meanD = data.reduce(function(s, v) { return s + v; }, 0) / n;
    var acf = [];
    for (var k = 1; k <= lag; k++) {
      var cov = 0, varD = 0;
      for (var i = 0; i < n - k; i++) { cov += (data[i] - meanD) * (data[i + k] - meanD); }
      for (var i = 0; i < n; i++) { varD += (data[i] - meanD) * (data[i] - meanD); }
      acf.push(varD > 0 ? cov / varD : 0);
    }
    var Q = 0;
    for (var k = 0; k < lag; k++) { Q += acf[k] * acf[k] / (n - (k + 1)); }
    Q *= n * (n + 2);

    // 波动率聚集强度（基于标准化残差的ACF平方和）
    var volCluster = Math.min(100, Math.max(0, (1 - 1 / (1 + Q / n)) * 100));

    var archConclusion = archP < alpha ? '存在' : '不存在';
    var bdsConclusion = bdsP < alpha ? '拒绝' : '不拒绝';

    var out = 'ARCH LM 统计量: ' + archLM.toFixed(3) + '\n' +
              'ARCH LM p值: ' + archP.toFixed(3) + '\n' +
              'ARCH LM 结论: ' + archConclusion + '显著ARCH效应\n' +
              'BDS 统计量: ' + bdsStat.toFixed(3) + '\n' +
              'BDS p值: ' + bdsP.toFixed(3) + '\n' +
              'BDS 结论: ' + bdsConclusion + 'i.i.d.假设\n' +
              '波动率聚集强度: ' + volCluster.toFixed(2) + '%';

    document.getElementById('resultValue').textContent = out;
    document.getElementById('resultBox').classList.add('show');
  }

  function chiSqCDF(x, df) {
    var k = df / 2;
    var g = gammaLn(k);
    var s = 0, t = 0;
    for (var i = 0; i < 200; i++) {
      t += Math.pow(x / 2, i) / factorial(i);
      s = t / (i + k);
      if (i > 10 && Math.abs(s) < 1e-10) break;
    }
    return Math.pow(x / 2, k) * Math.exp(-x / 2 - g) * s;
  }

  function gammaLn(x) {
    var c = [76.18009172947146, -86.50532032941677, 24.01409824083091,
             -1.231739572450155, 0.001208650973866179, -0.000005395239384953];
    var y = x, tmp = x + 5.5;
    tmp -= (x + 0.5) * Math.log(tmp);
    var ser = 1.000000000190015;
    for (var i = 0; i < 6; i++) { y++; ser += c[i] / y; }
    return -tmp + Math.log(2.5066282746310005 * ser / x);
  }

  function factorial(n) {
    if (n <= 1) return 1;
    var f = 1;
    for (var i = 2; i <= n; i++) { f *= i; }
    return f;
  }

  function normCDF(x) {
    var t = 1 / (1 + 0.2316419 * Math.abs(x));
    var poly = t * (0.319381530 + t * (-0.356563782 + t * (1.781477937 + t * (-1.821255978 + t * 1.330274429))));
    var pdf = Math.exp(-0.5 * x * x) / Math.sqrt(2 * Math.PI);
    var y = pdf * poly;
    return x >= 0 ? 1 - y : y;
  }
  </script>
