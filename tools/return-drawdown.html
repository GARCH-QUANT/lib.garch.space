<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>⑮ 年化收益&回撤快捷计算器 | GARCH ToolBox</title>
  <meta name="description" content="CAGR、年化波动率、最大回撤、Calmar 比率一键计算">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/style.css">
</head>
<body>
  <header class="site-nav">
    <div class="nav-inner">
      <a href="/" class="nav-logo">
        <span class="logo-icon">Σ</span>
        <span class="logo-text">GARCH <span class="logo-accent">ToolBox</span></span>
      </a>
      <nav class="nav-links">
        <a href="/" class="nav-link">首页</a>
        <a href="/tools/" class="nav-link active">工具列表</a>
        <button class="theme-toggle" id="themeToggle" aria-label="切换主题"><span class="theme-icon">◐</span></button>
      </nav>
    </div>
  </header>

  <main class="tool-page">
    <div class="tool-page-header">
      <h1 class="tool-page-title">⑮ 年化收益&回撤快捷计算器</h1>
      <p class="tool-page-sub">CAGR、年化波动率、最大回撤、Calmar 比率一键计算</p>
    </div>
    <div class="tool-form">
      <div class="form-grid">
        <div class="form-group">
          <label class="form-label">初始净值</label>
          <input type="text" class="form-input" id="param1" value="1.0" placeholder="1.0">
        </div>
        <div class="form-group">
          <label class="form-label">最终净值</label>
          <input type="text" class="form-input" id="param2" value="1.35" placeholder="1.35">
        </div>
        <div class="form-group">
          <label class="form-label">最大回撤 %</label>
          <input type="text" class="form-input" id="param3" value="12" placeholder="12">
        </div>
        <div class="form-group">
          <label class="form-label">持有年数</label>
          <input type="text" class="form-input" id="param4" value="3" placeholder="3">
        </div>
        <div class="form-group full">
          <label class="form-label">月度最大回撤序列 (可选)</label>
          <textarea class="form-textarea" id="dataInput" placeholder="-2.5%, -8.3%, -12.1%, -5.0%">-2.5, -8.3, -12.1, -5.0, -3.2, -1.5</textarea>
        </div>
      </div>
      <button class="btn-calc" onclick="calculate()">运行计算</button>
      <div class="result-box" id="resultBox">
        <div class="result-label">计算结果</div>
        <div class="result-value" id="resultValue">—</div>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p class="footer-copy">© 2026 GARCH QUANT | Quantitative Financial Tool Platform</p>
      <p class="footer-author">Fuli Yang, Ph.D.</p>
    </div>
  </footer>
  <script src="/assets/js/theme.js"></script>
  <script>
  function calculate() {
    var p1 = parseFloat(document.getElementById('param1').value); // 初始净值
    var p2 = parseFloat(document.getElementById('param2').value); // 最终净值
    var p3 = parseFloat(document.getElementById('param3').value); // 最大回撤%
    var p4 = parseFloat(document.getElementById('param4').value); // 持有年数
    var dataInput = document.getElementById('dataInput').value;

    // CAGR = (最终净值/初始净值)^(1/持有年数) - 1
    var cagr = Math.pow(p2 / p1, 1 / p4) - 1;
    var cagrPct = (cagr * 100).toFixed(2) + '%';

    // Calmar比率 = CAGR / |最大回撤%|
    var maxDrawdown = Math.abs(p3) / 100;
    var calmar = cagr / maxDrawdown;
    var calmarStr = calmar.toFixed(2);

    var results = 'CAGR: ' + cagrPct + '\n最大回撤: ' + p3.toFixed(2) + '%\nCalmar比率: ' + calmarStr;

    // 年化波动率：从月度最大回撤序列计算
    if (dataInput.trim()) {
      var drawdowns = dataInput.split(',').map(function(d) {
        return parseFloat(d.trim());
      }).filter(function(d) {
        return !isNaN(d);
      });

      if (drawdowns.length > 1) {
        var mean = drawdowns.reduce(function(sum, d) { return sum + d; }, 0) / drawdowns.length;
        var variance = drawdowns.reduce(function(sum, d) { return sum + Math.pow(d - mean, 2); }, 0) / (drawdowns.length - 1);
        var monthlyVol = Math.sqrt(variance);
        var annualVol = monthlyVol * Math.sqrt(12);
        results += '\n年化波动率: ' + (annualVol * 100).toFixed(2) + '%';
      }
    }

    document.getElementById('resultValue').textContent = results;
    document.getElementById('resultBox').classList.add('show');
  }
  </script>
</body>
</html>
