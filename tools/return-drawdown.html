<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>⑮ 年化收益&回撤快捷计算器 | GARCH ToolBox</title>
  <meta name="description" content="CAGR、年化波动率、最大回撤、Calmar 比率一键计算">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/style.css">
</head>
<body>
  <header class="site-nav">
    <div class="nav-inner">
      <a href="/" class="nav-logo">
        <span class="logo-icon">Σ</span>
        <span class="logo-text">GARCH <span class="logo-accent">ToolBox</span></span>
      </a>
      <nav class="nav-links">
        <a href="/" class="nav-link">首页</a>
        <a href="/tools/" class="nav-link active">工具列表</a>
        <button class="theme-toggle" id="themeToggle" aria-label="切换主题"><span class="theme-icon">◐</span></button>
      </nav>
    </div>
  </header>

  <main class="tool-page">
    <div class="tool-page-header">
      <h1 class="tool-page-title">⑮ 年化收益&回撤快捷计算器</h1>
      <p class="tool-page-sub">CAGR、年化波动率、最大回撤、Calmar 比率一键计算</p>
    </div>
    <div class="tool-form">
      <div class="form-grid">
        <div class="form-group">
          <label class="form-label">初始净值</label>
          <input type="text" class="form-input" id="param1" value="1.0" placeholder="1.0">
        </div>
        <div class="form-group">
          <label class="form-label">最终净值</label>
          <input type="text" class="form-input" id="param2" value="1.35" placeholder="1.35">
        </div>
        <div class="form-group">
          <label class="form-label">最大回撤 %</label>
          <input type="text" class="form-input" id="param3" value="12" placeholder="12">
        </div>
        <div class="form-group">
          <label class="form-label">持有年数</label>
          <input type="text" class="form-input" id="param4" value="3" placeholder="3">
        </div>
        <div class="form-group full">
          <label class="form-label">月度最大回撤序列 (可选)</label>
          <textarea class="form-textarea" id="dataInput" placeholder="-2.5%, -8.3%, -12.1%, -5.0%">-2.5, -8.3, -12.1, -5.0, -3.2, -1.5</textarea>
        </div>
      </div>
      <button class="btn-calc" onclick="calculate()">运行计算</button>
      <div class="result-box" id="resultBox">
        <div class="result-label">计算结果</div>
        <div class="result-value" id="resultValue">—</div>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p class="footer-copy">© 2026 GARCH QUANT | Quantitative Financial Tool Platform</p>
      <p class="footer-author">Fuli Yang, Ph.D.</p>
    </div>
  </footer>
  <script src="/assets/js/theme.js"></script>
  <script>
  function calculate() {
    var p1 = document.getElementById('param1').value;
    var p2 = document.getElementById('param2').value;
    var p3 = document.getElementById('param3').value;
    var p4 = document.getElementById('param4').value;
    document.getElementById('resultValue').textContent = '参数已记录: ' + p1 + ' / ' + p2 + ' / ' + p3 + ' / ' + p4;
    document.getElementById('resultBox').classList.add('show');
  }
  </script>
</body>
</html>
