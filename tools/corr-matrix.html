<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>⑪ 多资产相关性矩阵分析工具 | GARCH ToolBox</title>
  <meta name="description" content="Pearson / Spearman / Kendall 相关矩阵，热力图可视化">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/style.css">
</head>
<body>
  <header class="site-nav">
    <div class="nav-inner">
      <a href="/" class="nav-logo">
        <span class="logo-icon">Σ</span>
        <span class="logo-text">GARCH <span class="logo-accent">ToolBox</span></span>
      </a>
      <nav class="nav-links">
        <a href="/" class="nav-link">首页</a>
        <a href="/tools/" class="nav-link active">工具列表</a>
        <button class="theme-toggle" id="themeToggle" aria-label="切换主题"><span class="theme-icon">◐</span></button>
      </nav>
    </div>
  </header>

  <main class="tool-page">
    <div class="tool-page-header">
      <h1 class="tool-page-title">⑪ 多资产相关性矩阵分析工具</h1>
      <p class="tool-page-sub">Pearson / Spearman / Kendall 相关矩阵，热力图可视化</p>
    </div>
    <div class="tool-form">
      <div class="form-grid">
        <div class="form-group">
          <label class="form-label">资产数量 N</label>
          <input type="text" class="form-input" id="param1" value="4" placeholder="2~20">
        </div>
        <div class="form-group">
          <label class="form-label">方法</label>
          <input type="text" class="form-input" id="param2" value="pearson" placeholder="pearson / spearman / kendall">
        </div>
        <div class="form-group">
          <label class="form-label">序列长度</label>
          <input type="text" class="form-input" id="param3" value="252" placeholder="252">
        </div>
        <div class="form-group">
          <label class="form-label">随机种子</label>
          <input type="text" class="form-input" id="param4" value="123" placeholder="123">
        </div>
        <div class="form-group full">
          <label class="form-label">资产价格/收益率序列 (逗号分隔)</label>
          <textarea class="form-textarea" id="dataInput" placeholder="逗号分隔的多个序列">0.012,-0.008,0.015,-0.005,0.020
0.010,-0.005,0.020,-0.010,0.015
0.008,-0.012,0.005,0.015,-0.008
0.015,-0.003,0.010,-0.005,0.012</textarea>
        </div>
      </div>
      <button class="btn-calc" onclick="calculate()">运行计算</button>
      <div class="result-box" id="resultBox">
        <div class="result-label">计算结果</div>
        <div class="result-value" id="resultValue">—</div>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p class="footer-copy">© 2026 GARCH QUANT | Quantitative Financial Tool Platform</p>
      <p class="footer-author">Fuli Yang, Ph.D.</p>
    </div>
  </footer>
  <script src="/assets/js/theme.js"></script>
  <script>
  function calculate() {
    var dataInput = document.getElementById('dataInput').value.trim();
    var method = document.getElementById('param2').value.toLowerCase().trim();

    // 解析数据：按换行分割，每行是一个资产的收益率序列
    var lines = dataInput.split('\n');
    var assets = [];
    for (var i = 0; i < lines.length; i++) {
      var line = lines[i].trim();
      if (line) {
        var values = line.split(',').map(function(v) { return parseFloat(v.trim()); });
        if (values.some(isNaN)) {
          document.getElementById('resultValue').textContent = '错误：数据包含无效数字';
          document.getElementById('resultBox').classList.add('show');
          return;
        }
        assets.push(values);
      }
    }

    var n = assets.length;
    if (n === 0) {
      document.getElementById('resultValue').textContent = '错误：没有有效数据';
      document.getElementById('resultBox').classList.add('show');
      return;
    }

    // 确保所有序列长度一致，取最短长度
    var seqLength = Math.min.apply(null, assets.map(function(a) { return a.length; }));
    var data = assets.map(function(a) { return a.slice(0, seqLength); });

    var result;
    if (method === 'pearson') {
      result = pearsonMatrix(data);
    } else if (method === 'spearman') {
      result = spearmanMatrix(data);
    } else if (method === 'kendall') {
      result = kendallMatrix(data);
    } else {
      document.getElementById('resultValue').textContent = '错误：支持 pearson/spearman/kendall';
      document.getElementById('resultBox').classList.add('show');
      return;
    }

    // 格式化输出
    var label = method.charAt(0).toUpperCase() + method.slice(1) + ' 相关矩阵:';
    var lines_out = [label];
    for (var i = 0; i < result.length; i++) {
      var row = result[i].map(function(v) { return v.toFixed(3).padStart(5, ' '); }).join(' ');
      lines_out.push(row);
    }

    document.getElementById('resultValue').textContent = lines_out.join('\n');
    document.getElementById('resultBox').classList.add('show');
  }

  function pearsonMatrix(data) {
    var n = data.length;
    var matrix = [];
    for (var i = 0; i < n; i++) {
      matrix[i] = [];
      for (var j = 0; j < n; j++) {
        matrix[i][j] = pearsonCorr(data[i], data[j]);
      }
    }
    return matrix;
  }

  function pearsonCorr(x, y) {
    if (x.length !== y.length) return NaN;
    var n = x.length;
    var meanX = mean(x), meanY = mean(y);
    var cov = 0, varX = 0, varY = 0;
    for (var i = 0; i < n; i++) {
      var dx = x[i] - meanX, dy = y[i] - meanY;
      cov += dx * dy;
      varX += dx * dx;
      varY += dy * dy;
    }
    if (varX === 0 || varY === 0) return 0;
    return cov / Math.sqrt(varX * varY);
  }

  function mean(arr) {
    return arr.reduce(function(s, v) { return s + v; }, 0) / arr.length;
  }

  function spearmanMatrix(data) {
    var n = data.length;
    var ranked = data.map(function(seq) { return rank(seq); });
    return pearsonMatrix(ranked);
  }

  function rank(seq) {
    var indexed = seq.map(function(v, i) { return { v: v, i: i }; });
    indexed.sort(function(a, b) { return a.v - b.v; });
    var ranks = new Array(seq.length);
    for (var i = 0; i < indexed.length; i++) {
      ranks[indexed[i].i] = i + 1;
    }
    return ranks;
  }

  function kendallMatrix(data) {
    var n = data.length;
    var matrix = [];
    for (var i = 0; i < n; i++) {
      matrix[i] = [];
      for (var j = 0; j < n; j++) {
        matrix[i][j] = kendallTau(data[i], data[j]);
      }
    }
    return matrix;
  }

  function kendallTau(x, y) {
    if (x.length !== y.length) return NaN;
    var n = x.length;
    var totalPairs = n * (n - 1) / 2;
    if (totalPairs === 0) return 1;
    var concordant = 0, discordant = 0;
    for (var i = 0; i < n; i++) {
      for (var j = i + 1; j < n; j++) {
        var dx = x[j] - x[i];
        var dy = y[j] - y[i];
        var product = dx * dy;
        if (product > 0) concordant++;
        else if (product < 0) discordant++;
      }
    }
    return (concordant - discordant) / totalPairs;
  }
  </script>
</body>
</html>
