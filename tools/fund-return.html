<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>⑥ 基金净值收益率批量处理器 | GARCH ToolBox</title>
  <meta name="description" content="批量计算净值序列收益率、年化收益、最大回撤、波动率">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/style.css">
</head>
<body>
  <header class="site-nav">
    <div class="nav-inner">
      <a href="/" class="nav-logo">
        <span class="logo-icon">Σ</span>
        <span class="logo-text">GARCH <span class="logo-accent">ToolBox</span></span>
      </a>
      <nav class="nav-links">
        <a href="/" class="nav-link">首页</a>
        <a href="/tools/" class="nav-link active">工具列表</a>
        <button class="theme-toggle" id="themeToggle" aria-label="切换主题"><span class="theme-icon">◐</span></button>
      </nav>
    </div>
  </header>

  <main class="tool-page">
    <div class="tool-page-header">
      <h1 class="tool-page-title">⑥ 基金净值收益率批量处理器</h1>
      <p class="tool-page-sub">批量计算净值序列收益率、年化收益、最大回撤、波动率</p>
    </div>
    <div class="tool-form">
      <div class="form-grid">
        <div class="form-group">
          <label class="form-label">计算周期</label>
          <input type="text" class="form-input" id="param1" value="日频" placeholder="日频 / 周频 / 月频">
        </div>
        <div class="form-group">
          <label class="form-label">无风险利率 %</label>
          <input type="text" class="form-input" id="param2" value="3" placeholder="3">
        </div>
        <div class="form-group">
          <label class="form-label">最大回撤阈值 %</label>
          <input type="text" class="form-input" id="param3" value="20" placeholder="20">
        </div>
        <div class="form-group">
          <label class="form-label">波动率上限 %</label>
          <input type="text" class="form-input" id="param4" value="25" placeholder="25">
        </div>
        <div class="form-group full">
          <label class="form-label">基金净值序列</label>
          <textarea class="form-textarea" id="dataInput" placeholder="1.00,1.02,0.98,1.05,1.08">1.000,1.015,1.030,1.025,1.050,1.070,1.060,1.080</textarea>
        </div>
      </div>
      <button class="btn-calc" onclick="calculate()">运行计算</button>
      <div class="result-box" id="resultBox">
        <div class="result-label">计算结果</div>
        <div class="result-value" id="resultValue">—</div>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p class="footer-copy">© 2026 GARCH QUANT | Quantitative Financial Tool Platform</p>
      <p class="footer-author">Fuli Yang, Ph.D.</p>
    </div>
  </footer>
  <script src="/assets/js/theme.js"></script>
  <script>
  function calculate() {
    var p1 = document.getElementById('param1').value;
    var p2 = parseFloat(document.getElementById('param2').value) || 3;
    var p3 = parseFloat(document.getElementById('param3').value) || 20;
    var p4 = parseFloat(document.getElementById('param4').value) || 25;
    var dataInput = document.getElementById('dataInput').value;

    var navs = dataInput.split(',').map(function(v) { return parseFloat(v.trim()); });
    if (navs.length === 0 || isNaN(navs[0])) {
      document.getElementById('resultValue').textContent = '请输入有效的净值序列';
      document.getElementById('resultBox').classList.add('show');
      return;
    }

    var N = navs.length;

    // 年化因子
    var annFactor = 252;
    if (p1 === '周频') annFactor = 52;
    else if (p1 === '月频') annFactor = 12;

    // 收益率序列
    var returns = [];
    for (var i = 1; i < N; i++) {
      returns.push((navs[i] - navs[i - 1]) / navs[i - 1]);
    }

    // 总收益率
    var totalReturn = (navs[N - 1] / navs[0]) - 1;

    // 年化收益率
    var annReturn = Math.pow(1 + totalReturn, annFactor / N) - 1;

    // 年化波动率
    var mean = returns.reduce(function(a, b) { return a + b; }, 0) / returns.length;
    var variance = returns.reduce(function(a, b) { return a + Math.pow(b - mean, 2); }, 0) / (returns.length - 1);
    var annVol = Math.sqrt(variance) * Math.sqrt(annFactor);

    // 最大回撤
    var peak = navs[0];
    var maxDD = 0;
    for (var i = 0; i < N; i++) {
      if (navs[i] > peak) peak = navs[i];
      var dd = (peak - navs[i]) / peak;
      if (dd > maxDD) maxDD = dd;
    }

    // 卡尔玛比率
    var calmar = maxDD === 0 ? 0 : annReturn / maxDD;

    // 无风险利率
    var rf = p2 / 100;

    // 超额收益序列
    var excessReturns = [];
    for (var i = 0; i < returns.length; i++) {
      excessReturns.push(returns[i] - rf / annFactor);
    }

    // 跟踪误差 = stdev(r - rf/年化因子) * sqrt(年化因子)
    var exMean = excessReturns.reduce(function(a, b) { return a + b; }, 0) / excessReturns.length;
    var exVariance = excessReturns.reduce(function(a, b) { return a + Math.pow(b - exMean, 2); }, 0) / (excessReturns.length - 1);
    var trackingError = Math.sqrt(exVariance) * Math.sqrt(annFactor);

    // 信息比率 = 超额收益 / 跟踪误差
    var excessReturn = annReturn - rf;
    var infoRatio = trackingError === 0 ? 0 : excessReturn / trackingError;

    var result = '总收益率: ' + (totalReturn * 100).toFixed(2) + '%\n' +
                 '年化收益率: ' + (annReturn * 100).toFixed(2) + '%\n' +
                 '年化波动率: ' + (annVol * 100).toFixed(2) + '%\n' +
                 '最大回撤: ' + (maxDD * 100).toFixed(2) + '%\n' +
                 '卡尔玛比率: ' + calmar.toFixed(2) + '\n' +
                 '信息比率: ' + infoRatio.toFixed(2);

    document.getElementById('resultValue').textContent = result;
    document.getElementById('resultBox').classList.add('show');
  }
  </script>
</body>
</html>
