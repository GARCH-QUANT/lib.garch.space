<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>⑧ EGARCH/GJR 非对称波动率模型 | GARCH ToolBox</title>
  <meta name="description" content="杠杆效应识别、新闻影响曲线、波动率非对称性量化分析">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/style.css">
</head>
<body>
  <header class="site-nav">
    <div class="nav-inner">
      <a href="/" class="nav-logo">
        <span class="logo-icon">Σ</span>
        <span class="logo-text">GARCH <span class="logo-accent">ToolBox</span></span>
      </a>
      <nav class="nav-links">
        <a href="/" class="nav-link">首页</a>
        <a href="/tools/" class="nav-link active">工具列表</a>
        <button class="theme-toggle" id="themeToggle" aria-label="切换主题"><span class="theme-icon">◐</span></button>
      </nav>
    </div>
  </header>

  <main class="tool-page">
    <div class="tool-page-header">
      <h1 class="tool-page-title">⑧ EGARCH/GJR 非对称波动率模型</h1>
      <p class="tool-page-sub">杠杆效应识别、新闻影响曲线、波动率非对称性量化分析</p>
    </div>
    <div class="tool-form">
      <div class="form-grid">
        <div class="form-group">
          <label class="form-label">ω 参数</label>
          <input type="text" class="form-input" id="param1" value="-0.1" placeholder="-0.5~0">
        </div>
        <div class="form-group">
          <label class="form-label">α 参数</label>
          <input type="text" class="form-input" id="param2" value="0.08" placeholder="0~0.3">
        </div>
        <div class="form-group">
          <label class="form-label">γ 杠杆参数</label>
          <input type="text" class="form-input" id="param3" value="0.05" placeholder="0~0.3">
        </div>
        <div class="form-group">
          <label class="form-label">β 持续性参数</label>
          <input type="text" class="form-input" id="param4" value="0.92" placeholder="0.8~0.99">
        </div>
        <div class="form-group full">
          <label class="form-label">条件收益率序列</label>
          <textarea class="form-textarea" id="dataInput" placeholder="0.01,-0.02,0.015,...">0.012,-0.008,0.015,-0.005,0.020,-0.012,0.018</textarea>
        </div>
      </div>
      <button class="btn-calc" onclick="calculate()">运行计算</button>
      <div class="result-box" id="resultBox">
        <div class="result-label">计算结果</div>
        <div class="result-value" id="resultValue">—</div>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p class="footer-copy">© 2026 GARCH QUANT | Quantitative Financial Tool Platform</p>
      <p class="footer-author">Fuli Yang, Ph.D.</p>
    </div>
  </footer>
  <script src="/assets/js/theme.js"></script>
  <script>
  function calculate() {
    var p1 = parseFloat(document.getElementById('param1').value);
    var p2 = parseFloat(document.getElementById('param2').value);
    var p3 = parseFloat(document.getElementById('param3').value);
    var p4 = parseFloat(document.getElementById('param4').value);
    var dataStr = document.getElementById('dataInput').value;

    var returns = dataStr.split(',').map(function(s) { return parseFloat(s.trim()); }).filter(function(n) { return !isNaN(n); });

    if (returns.length < 2) {
      document.getElementById('resultValue').innerHTML = '需要至少2个收益率数据';
      document.getElementById('resultBox').classList.add('show');
      return;
    }

    var mean = returns.reduce(function(a, b) { return a + b; }, 0) / returns.length;
    var squaredDiffs = returns.map(function(r) { return Math.pow(r - mean, 2); });
    var sampleVar = squaredDiffs.reduce(function(a, b) { return a + b; }, 0) / (returns.length - 1);
    var sqrt252 = Math.sqrt(252);

    // EGARCH(1,1)
    var h_egarch = sampleVar;
    var log_h_egarch = Math.log(h_egarch);
    for (var i = 1; i < returns.length; i++) {
      var eps = returns[i - 1];
      var sqrt_h = Math.sqrt(h_egarch);
      log_h_egarch = p1 + p2 * Math.abs(eps) / sqrt_h + p3 * eps / sqrt_h + p4 * log_h_egarch;
      h_egarch = Math.exp(log_h_egarch);
    }
    var egarch_annual = Math.sqrt(h_egarch) * sqrt252 * 100;

    // GJR-GARCH(1,1)
    var h_gjr = sampleVar;
    for (var i = 1; i < returns.length; i++) {
      var eps = returns[i - 1];
      var I = eps < 0 ? 1 : 0;
      h_gjr = p1 + (p2 + p3 * I) * eps * eps + p4 * h_gjr;
    }
    var gjr_annual = Math.sqrt(h_gjr) * sqrt252 * 100;

    // Positive and negative shock coefficients
    var posCoef = p2;
    var negCoef = p2 + p3;

    // Leverage effect
    var leverage = (negCoef / posCoef - 1) * 100;

    // Half-life
    var halfLife = Math.log(0.5) / Math.log(p4);

    var resultHTML = 'EGARCH 条件波动率(年化): ' + egarch_annual.toFixed(2) + '%<br>' +
      'GJR 条件波动率(年化): ' + gjr_annual.toFixed(2) + '%<br>' +
      '正冲击系数: ' + posCoef.toFixed(2) + '<br>' +
      '负冲击系数: ' + negCoef.toFixed(2) + '<br>' +
      '杠杆效应: +' + leverage.toFixed(1) + '%<br>' +
      '持久性 β: ' + p4.toFixed(2) + '<br>' +
      '半衰期: ' + halfLife.toFixed(1) + ' 天';

    document.getElementById('resultValue').innerHTML = resultHTML;
    document.getElementById('resultBox').classList.add('show');
  }
  </script>
</body>
</html>
