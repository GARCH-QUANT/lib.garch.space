<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>④ 策略回测绩效校验工具 | GARCH ToolBox</title>
  <meta name="description" content="收益率曲线、胜率、夏普比率、最大回撤、卡玛比率综合评估">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/style.css">
</head>
<body>
  <header class="site-nav">
    <div class="nav-inner">
      <a href="/" class="nav-logo">
        <span class="logo-icon">Σ</span>
        <span class="logo-text">GARCH <span class="logo-accent">ToolBox</span></span>
      </a>
      <nav class="nav-links">
        <a href="/" class="nav-link">首页</a>
        <a href="/tools/" class="nav-link active">工具列表</a>
        <button class="theme-toggle" id="themeToggle" aria-label="切换主题"><span class="theme-icon">◐</span></button>
      </nav>
    </div>
  </header>

  <main class="tool-page">
    <div class="tool-page-header">
      <h1 class="tool-page-title">④ 策略回测绩效校验工具</h1>
      <p class="tool-page-sub">收益率曲线、胜率、夏普比率、最大回撤、卡玛比率综合评估</p>
    </div>
    <div class="tool-form">
      <div class="form-grid">
        <div class="form-group">
          <label class="form-label">初始资金</label>
          <input type="text" class="form-input" id="param1" value="100000" placeholder="100000">
        </div>
        <div class="form-group">
          <label class="form-label">年化基准收益 %</label>
          <input type="text" class="form-input" id="param2" value="10" placeholder="10">
        </div>
        <div class="form-group">
          <label class="form-label">策略年化收益 %</label>
          <input type="text" class="form-input" id="param3" value="18" placeholder="18">
        </div>
        <div class="form-group">
          <label class="form-label">年化波动率 %</label>
          <input type="text" class="form-input" id="param4" value="12" placeholder="12">
        </div>
        <div class="form-group full">
          <label class="form-label">月度收益率序列</label>
          <textarea class="form-textarea" id="dataInput" placeholder="0.01,-0.02,0.015,...">0.012,-0.008,0.015,-0.005,0.020,0.018,-0.010</textarea>
        </div>
      </div>
      <button class="btn-calc" onclick="calculate()">运行计算</button>
      <div class="result-box" id="resultBox">
        <div class="result-label">计算结果</div>
        <div class="result-value" id="resultValue">—</div>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p class="footer-copy">© 2026 GARCH QUANT | Quantitative Financial Tool Platform</p>
      <p class="footer-author">Fuli Yang, Ph.D.</p>
    </div>
  </footer>
  <script src="/assets/js/theme.js"></script>
  <script>
  function calculate() {
    var dataInput = document.getElementById('dataInput').value;
    var param2 = parseFloat(document.getElementById('param2').value) || 10;
    var param3 = parseFloat(document.getElementById('param3').value) || 18;
    var param4 = parseFloat(document.getElementById('param4').value) || 12;

    // 1. 解析月度收益率数组
    var returns = dataInput.split(',').map(function(v) { return parseFloat(v.trim()); });
    var N = returns.length;

    // 2. 累积净值曲线
    var nav = [1];
    for (var i = 1; i < N; i++) {
      nav.push(nav[i-1] * (1 + returns[i]));
    }

    // 3. 总收益率
    var totalReturn = nav[nav.length - 1] - 1;

    // 4. 年化收益率
    var annualizedReturn = Math.pow(1 + totalReturn, 12 / N) - 1;

    // 5. 夏普比率
    // rf = 3% (param2=10 → 10% 基准收益, rf≈3%)
    var rf = 0.03;
    var sharpeRatio = (param3 / 100 - rf) / (param4 / 100);

    // 6. 最大回撤
    var peak = 1;
    var maxDrawdown = 0;
    for (var i = 0; i < nav.length; i++) {
      if (nav[i] > peak) peak = nav[i];
      var dd = (peak - nav[i]) / peak;
      if (dd > maxDrawdown) maxDrawdown = dd;
    }

    // 7. 卡玛比率
    var calmarRatio = annualizedReturn / maxDrawdown;

    // 8. 胜率
    var positiveMonths = 0;
    for (var i = 0; i < N; i++) {
      if (returns[i] > 0) positiveMonths++;
    }
    var winRate = positiveMonths / N;

    // 9. 索提诺比率
    var negativeReturns = [];
    for (var i = 0; i < N; i++) {
      if (returns[i] < 0) negativeReturns.push(returns[i]);
    }
    var downsideStd = 0;
    if (negativeReturns.length > 1) {
      var negMean = negativeReturns.reduce(function(a, b) { return a + b; }, 0) / negativeReturns.length;
      var sumSq = 0;
      for (var i = 0; i < negativeReturns.length; i++) {
        sumSq += Math.pow(negativeReturns[i] - negMean, 2);
      }
      downsideStd = Math.sqrt(sumSq / (negativeReturns.length - 1)) * Math.sqrt(12);
    }
    var sortinoRatio = downsideStd > 0 ? (annualizedReturn - rf) / downsideStd : 0;

    // 输出结果
    var result = '总收益率: ' + (totalReturn * 100).toFixed(2) + '%\n' +
                 '年化收益率: ' + (annualizedReturn * 100).toFixed(2) + '%\n' +
                 '夏普比率: ' + sharpeRatio.toFixed(2) + '\n' +
                 '最大回撤: ' + (maxDrawdown * 100).toFixed(2) + '%\n' +
                 '卡玛比率: ' + calmarRatio.toFixed(2) + '\n' +
                 '胜率: ' + (winRate * 100).toFixed(1) + '%\n' +
                 '索提诺比率: ' + sortinoRatio.toFixed(2);

    document.getElementById('resultValue').textContent = result;
    document.getElementById('resultBox').classList.add('show');
  }
  </script>
</body>
</html>
