<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>⑩ 量化绩效比率计算器 | GARCH ToolBox</title>
  <meta name="description" content="夏普比率、卡玛比率、索提诺比率、Sortino 比率批量计算">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/style.css">
</head>
<body>
  <header class="site-nav">
    <div class="nav-inner">
      <a href="/" class="nav-logo">
        <span class="logo-icon">Σ</span>
        <span class="logo-text">GARCH <span class="logo-accent">ToolBox</span></span>
      </a>
      <nav class="nav-links">
        <a href="/" class="nav-link">首页</a>
        <a href="/tools/" class="nav-link active">工具列表</a>
        <button class="theme-toggle" id="themeToggle" aria-label="切换主题"><span class="theme-icon">◐</span></button>
      </nav>
    </div>
  </header>

  <main class="tool-page">
    <div class="tool-page-header">
      <h1 class="tool-page-title">⑩ 量化绩效比率计算器</h1>
      <p class="tool-page-sub">夏普比率、卡玛比率、索提诺比率、Sortino 比率批量计算</p>
    </div>
    <div class="tool-form">
      <div class="form-grid">
        <div class="form-group">
          <label class="form-label">年化收益率 %</label>
          <input type="text" class="form-input" id="param1" value="18" placeholder="18">
        </div>
        <div class="form-group">
          <label class="form-label">年化波动率 %</label>
          <input type="text" class="form-input" id="param2" value="12" placeholder="12">
        </div>
        <div class="form-group">
          <label class="form-label">下行偏差 %</label>
          <input type="text" class="form-input" id="param3" value="8" placeholder="8">
        </div>
        <div class="form-group">
          <label class="form-label">最大回撤 %</label>
          <input type="text" class="form-input" id="param4" value="15" placeholder="15">
        </div>
        <div class="form-group full">
          <label class="form-label">月度超额收益序列 %</label>
          <textarea class="form-textarea" id="dataInput" placeholder="0.5,-1.2,0.8,...">0.5,-1.2,0.8,-0.3,2.1,1.5,-0.8,0.2,1.8,-0.6</textarea>
        </div>
      </div>
      <button class="btn-calc" onclick="calculate()">运行计算</button>
      <div class="result-box" id="resultBox">
        <div class="result-label">计算结果</div>
        <div class="result-value" id="resultValue">—</div>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p class="footer-copy">© 2026 GARCH QUANT | Quantitative Financial Tool Platform</p>
      <p class="footer-author">Fuli Yang, Ph.D.</p>
    </div>
  </footer>
  <script src="/assets/js/theme.js"></script>
  <script>
  function calculate() {
    var p1 = parseFloat(document.getElementById('param1').value) || 0;
    var p2 = parseFloat(document.getElementById('param2').value) || 0;
    var p3 = parseFloat(document.getElementById('param3').value) || 0;
    var p4 = parseFloat(document.getElementById('param4').value) || 0;
    var dataInput = document.getElementById('dataInput').value;

    var sharpe = p2 !== 0 ? (p1 / p2) : 0;
    var sortino = p3 !== 0 ? (p1 / p3) : 0;
    var calmar = p4 !== 0 ? (p1 / p4) : 0;

    var data = [];
    if (dataInput.trim()) {
      data = dataInput.split(',').map(function(v) { return parseFloat(v); }).filter(function(v) { return !isNaN(v); });
    }

    var winRate = 0, avgReturn = 0;
    if (data.length > 0) {
      var positiveCount = 0;
      var sum = 0;
      var downStdev = 0;
      for (var i = 0; i < data.length; i++) {
        sum += data[i];
        if (data[i] > 0) positiveCount++;
      }
      avgReturn = sum / data.length;
      winRate = (positiveCount / data.length) * 100;

      var downData = [];
      for (var j = 0; j < data.length; j++) {
        if (data[j] < 0) downData.push(data[j]);
      }
      if (downData.length > 0) {
        var downMean = 0;
        for (var k = 0; k < downData.length; k++) downMean += downData[k];
        downMean /= downData.length;
        var downVar = 0;
        for (var l = 0; l < downData.length; l++) {
          downVar += Math.pow(downData[l] - downMean, 2);
        }
        downVar /= downData.length;
        var downSD = Math.sqrt(downVar);
        sortino = downSD !== 0 ? (avgReturn / downSD) : 0;
      }
    }

    var infoRatio = 0;
    if (data.length > 0) {
      var meanR = avgReturn / 100;
      var variance = 0;
      for (var m = 0; m < data.length; m++) {
        variance += Math.pow(data[m] / 100 - meanR, 2);
      }
      variance /= data.length;
      var stdR = Math.sqrt(variance);
      infoRatio = stdR !== 0 ? (meanR / stdR) * Math.sqrt(12) : 0;
    }

    var result = '夏普比率: ' + sharpe.toFixed(2) + '\n';
    result += '索提诺比率: ' + sortino.toFixed(2) + '\n';
    result += '卡玛比率: ' + calmar.toFixed(2) + '\n';
    result += 'Sortino比率: ' + sortino.toFixed(2) + '\n';
    result += '胜率: ' + winRate.toFixed(1) + '%\n';
    result += '平均超额收益: ' + avgReturn.toFixed(2) + '%';

    document.getElementById('resultValue').textContent = result;
    document.getElementById('resultBox').classList.add('show');
  }
  </script>
</body>
</html>
