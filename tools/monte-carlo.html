<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>⑬ 蒙特卡洛模拟金融风险测算 | GARCH ToolBox</title>
  <meta name="description" content="几何布朗运动 / 跳跃扩散路径模拟，概率分布与 VaR 估算">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/style.css">
</head>
<body>
  <header class="site-nav">
    <div class="nav-inner">
      <a href="/" class="nav-logo">
        <span class="logo-icon">Σ</span>
        <span class="logo-text">GARCH <span class="logo-accent">ToolBox</span></span>
      </a>
      <nav class="nav-links">
        <a href="/" class="nav-link">首页</a>
        <a href="/tools/" class="nav-link active">工具列表</a>
        <button class="theme-toggle" id="themeToggle" aria-label="切换主题"><span class="theme-icon">◐</span></button>
      </nav>
    </div>
  </header>

  <main class="tool-page">
    <div class="tool-page-header">
      <h1 class="tool-page-title">⑬ 蒙特卡洛模拟金融风险测算</h1>
      <p class="tool-page-sub">几何布朗运动 / 跳跃扩散路径模拟，概率分布与 VaR 估算</p>
    </div>
    <div class="tool-form">
      <div class="form-grid">
        <div class="form-group">
          <label class="form-label">模拟次数</label>
          <input type="text" class="form-input" id="param1" value="10000" placeholder="100~100000">
        </div>
        <div class="form-group">
          <label class="form-label">初始价格 S₀</label>
          <input type="text" class="form-input" id="param2" value="100" placeholder="100">
        </div>
        <div class="form-group">
          <label class="form-label">年化漂移 μ %</label>
          <input type="text" class="form-input" id="param3" value="8" placeholder="8">
        </div>
        <div class="form-group">
          <label class="form-label">年化波动率 σ %</label>
          <input type="text" class="form-input" id="param4" value="20" placeholder="20">
        </div>
        <div class="form-group full">
          <label class="form-label">交易日序列 (逗号分隔)</label>
          <textarea class="form-textarea" id="dataInput" placeholder="1, 21, 42, 63, 84 (交易日)">1, 21, 42, 63, 84, 105, 126, 147, 168, 189, 210, 231, 252</textarea>
        </div>
      </div>
      <button class="btn-calc" onclick="calculate()">运行计算</button>
      <div class="result-box" id="resultBox">
        <div class="result-label">计算结果</div>
        <div class="result-value" id="resultValue">—</div>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p class="footer-copy">© 2026 GARCH QUANT | Quantitative Financial Tool Platform</p>
      <p class="footer-author">Fuli Yang, Ph.D.</p>
    </div>
  </footer>
  <script src="/assets/js/theme.js"></script>
  <script>
  function calculate() {
    // Get parameters
    var n = parseInt(document.getElementById('param1').value) || 10000;
    var S0 = parseFloat(document.getElementById('param2').value) || 100;
    var mu = parseFloat(document.getElementById('param3').value) / 100 || 0.08;
    var sigma = parseFloat(document.getElementById('param4').value) / 100 || 0.20;
    var dataInput = document.getElementById('dataInput').value;
    
    // Parse trading days
    var defaultDays = [1,21,42,63,84,105,126,147,168,189,210,231,252];
    var days = [];
    if (dataInput && dataInput.trim()) {
        var parts = dataInput.split(',');
        for (var i = 0; i < parts.length; i++) {
            var d = parseInt(parts[i].trim());
            if (!isNaN(d) && d > 0) days.push(d);
        }
    }
    if (days.length === 0) days = defaultDays;
    
    // Use last day as terminal time
    var T = days[days.length - 1];
    
    // Generate terminal values using GBM
    var terminalValues = [];
    for (var i = 0; i < n; i++) {
        var Z = normalRandom();
        var t = T / 252;
        var ST = S0 * Math.exp((mu - sigma * sigma / 2) * t + sigma * Math.sqrt(t) * Z);
        terminalValues.push(ST);
    }
    
    // Sort for percentile calculations
    terminalValues.sort(function(a, b) { return a - b; });
    
    // Calculate statistics
    var sum = 0;
    for (var i = 0; i < n; i++) sum += terminalValues[i];
    var mean = sum / n;
    
    var sumSq = 0;
    for (var i = 0; i < n; i++) sumSq += (terminalValues[i] - mean) * (terminalValues[i] - mean);
    var stdDev = Math.sqrt(sumSq / n);
    
    var p5 = terminalValues[Math.floor(n * 0.05)];
    var p95 = terminalValues[Math.floor(n * 0.95)];
    var VaR = S0 - p5;
    
    // CVaR: average of values below P5
    var cvarSum = 0;
    var cvarCount = Math.floor(n * 0.05);
    for (var i = 0; i < cvarCount; i++) cvarSum += terminalValues[i];
    var CVaR = S0 - (cvarSum / cvarCount);
    
    var simError = stdDev / Math.sqrt(n);
    
    // Output results
    var output = 
        '模拟路径数: ' + n + '\n' +
        '终值均值: ' + mean.toFixed(2) + '\n' +
        '终值标准差: ' + stdDev.toFixed(2) + '\n' +
        '5%分位数(P5): ' + p5.toFixed(2) + '\n' +
        '95%分位数(P95): ' + p95.toFixed(2) + '\n' +
        'T=' + T + '天 VaR(5%): -' + VaR.toFixed(2) + '\n' +
        'T=' + T + '天 CVaR(5%): -' + CVaR.toFixed(2) + '\n' +
        '模拟误差: ±' + simError.toFixed(2);
    
    document.getElementById('resultValue').textContent = output;
    document.getElementById('resultBox').classList.add('show');
  }
  
  function normalRandom() {
    var u = 0, v = 0;
    while (u === 0) u = Math.random();
    while (v === 0) v = Math.random();
    return Math.sqrt(-2.0 * Math.log(u)) * Math.cos(2.0 * Math.PI * v);
  }
  </script>
</body>
</html>
