<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>⑫ 时间序列 ADF/KPSS 平稳性检验 | GARCH ToolBox</title>
  <meta name="description" content="ADF 检验、KPSS 检验、PP 检验，综合判断序列平稳性">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">

</head>
<body>
  <header class="site-nav">
    <div class="nav-inner">
      <a href="/" class="nav-logo">
        <span class="logo-icon">Σ</span>
        <span class="logo-text">GARCH <span class="logo-accent">ToolBox</span></span>
      </a>
      <nav class="nav-links">
        <a href="/" class="nav-link">首页</a>
        <a href="/tools/" class="nav-link active">工具列表</a>
        <button class="theme-toggle" id="themeToggle" aria-label="切换主题"><span class="theme-icon">◐</span></button>
      </nav>
    </div>
  </header>

  <main class="tool-page">
    <div class="tool-page-header">
      <h1 class="tool-page-title">⑫ 时间序列 ADF/KPSS 平稳性检验</h1>
      <p class="tool-page-sub">ADF 检验、KPSS 检验、PP 检验，综合判断序列平稳性</p>
    </div>
    <div class="tool-form">
      <div class="form-grid">
        <div class="form-group">
          <label class="form-label">ADF 滞后阶数</label>
          <input type="text" class="form-input" id="param1" value="0" placeholder="0~10">
        </div>
        <div class="form-group">
          <label class="form-label">KPSS 滞后阶数</label>
          <input type="text" class="form-input" id="param2" value="3" placeholder="1~12">
        </div>
        <div class="form-group">
          <label class="form-label">回归类型</label>
          <input type="text" class="form-input" id="param3" value="c" placeholder="c: 截距; ct: 截距+趋势; n: 无">
        </div>
        <div class="form-group">
          <label class="form-label">序列长度</label>
          <input type="text" class="form-input" id="param4" value="252" placeholder="252">
        </div>
        <div class="form-group full">
          <label class="form-label">时间序列数据</label>
          <textarea class="form-textarea" id="dataInput" placeholder="逗号分隔的数值序列">0.012,-0.008,0.015,-0.005,0.020,-0.012,0.018,0.005,-0.015,0.010</textarea>
        </div>
      </div>
      <button class="btn-calc" onclick="calculate()">运行计算</button>
      <div class="result-box" id="resultBox">
        <div class="result-label">计算结果</div>
        <div class="result-value" id="resultValue">—</div>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p class="footer-copy">© 2026 GARCH QUANT | Quantitative Financial Tool Platform</p>
      <p class="footer-author">Fuli Yang, Ph.D.</p>
    </div>
  </footer>
  <script src="/assets/js/theme.js"></script>
  <script>
  function calculate() {
    var adfLag = parseInt(document.getElementById('param1').value) || 0;
    var kpssLag = parseInt(document.getElementById('param2').value) || 3;
    var regType = document.getElementById('param3').value || 'c';
    var seriesLength = parseInt(document.getElementById('param4').value) || 252;
    var dataStr = document.getElementById('dataInput').value;
    
    var y = dataStr.split(',').map(function(v) { return parseFloat(v.trim()); }).filter(function(v) { return !isNaN(v); });
    var n = y.length;
    
    if (n < 3) {
      document.getElementById('resultValue').textContent = '数据不足，至少需要3个观测值';
      document.getElementById('resultBox').classList.add('show');
      return;
    }

    // ========== ADF Test ==========
    // Δy_t = a + b*t + c*y_{t-1} + Σδ_i*Δy_{t-i} + ε_t
    var deltaY = [];
    for (var i = 1; i < n; i++) {
      deltaY.push(y[i] - y[i-1]);
    }
    var yLag = y.slice(0, n - 1); // y_{t-1}
    
    var k = adfLag;
    var yDiff = deltaY.slice(k);
    var yLagAdjusted = yLag.slice(k);
    
    // Build design matrix: [1, t, y_{t-1}, Δy_{t-1}, ..., Δy_{t-k}]
    var X = [];
    for (var i = k; i < n - 1; i++) {
      var row = [1];
      // time trend
      if (regType === 'ct') {
        row.push(i + 1);
      }
      row.push(y[i]); // y_{t-1}
      // lagged differences
      for (var j = 1; j <= k; j++) {
        row.push(deltaY[i - j]);
      }
      X.push(row);
    }
    
    var Xt = transpose(X);
    var XtX = matMult(Xt, X);
    var XtXinv = invertMatrix(XtX);
    var Xty = matVecMult(Xt, yDiff);
    var beta = matVecMult(XtXinv, Xty);
    
    var yFit = [];
    for (var i = 0; i < X.length; i++) {
      var sum = 0;
      for (var j = 0; j < beta.length; j++) {
        sum += X[i][j] * beta[j];
      }
      yFit.push(sum);
    }
    
    var ssr = 0, sst = 0;
    var meanY = 0;
    for (var i = 0; i < yDiff.length; i++) meanY += yDiff[i];
    meanY /= yDiff.length;
    
    for (var i = 0; i < yDiff.length; i++) {
      ssr += (yDiff[i] - yFit[i]) * (yDiff[i] - yFit[i]);
      sst += (yDiff[i] - meanY) * (yDiff[i] - meanY);
    }
    var mse = ssr / (yDiff.length - beta.length);
    var seC = Math.sqrt(XtXinv[X.length > 0 ? X[0].length - 1 : 0][X.length > 0 ? X[0].length - 1 : 0] * mse);
    var coefC = beta[beta.length > 1 ? 1 : 0]; // y_{t-1} coefficient
    var tStat = coefC / seC;
    
    // MacKinnon approximate critical values and p-values
    var cv95 = regType === 'n' ? -1.94 : regType === 'c' ? -2.86 : -3.41;
    var cv99 = regType === 'n' ? -2.58 : regType === 'c' ? -3.44 : -3.96;
    
    // Approximate p-value using interpolation
    var adfStat = tStat;
    var adfPvalue = 0.01;
    if (adfStat > cv95) {
      adfPvalue = 0.10;
    } else if (adfStat > cv99) {
      adfPvalue = 0.05;
    }
    
    var adfConclusion = adfStat < cv95 ? '拒绝H0 (序列不平稳)' : '不拒绝H0 (序列平稳)';
    
    // ========== KPSS Test ==========
    // H0: series is stationary
    // LM = ΣS_t² / σ²
    var kpssN = Math.min(n, seriesLength);
    var ySlice = y.slice(0, kpssN);
    
    // Detrend if needed
    var yDetrended = ySlice;
    if (regType === 'c' || regType === 'ct') {
      var t = [];
      for (var i = 0; i < ySlice.length; i++) t.push(i + 1);
      var tMean = (kpssN + 1) / 2;
      var tVar = 0;
      for (var i = 0; i < kpssN; i++) tVar += (t[i] - tMean) * (t[i] - tMean);
      var yMean = 0;
      for (var i = 0; i < ySlice.length; i++) yMean += ySlice[i];
      yMean /= kpssN;
      
      var covYT = 0;
      for (var i = 0; i < kpssN; i++) covYT += (ySlice[i] - yMean) * (t[i] - tMean);
      var slope = covYT / tVar;
      var intercept = yMean - slope * tMean;
      
      yDetrended = [];
      for (var i = 0; i < kpssN; i++) {
        var predicted = intercept + slope * t[i];
        yDetrended.push(ySlice[i] - predicted);
      }
    }
    
    // Cumulative sum
    var S = [];
    var sum = 0;
    for (var i = 0; i < yDetrended.length; i++) {
      sum += yDetrended[i];
      S.push(sum);
    }
    
    var sigma2 = 0;
    for (var i = 0; i < yDetrended.length; i++) {
      sigma2 += yDetrended[i] * yDetrended[i];
    }
    sigma2 /= kpssN;
    
    var sumS2 = 0;
    for (var i = 0; i < S.length; i++) {
      sumS2 += S[i] * S[i];
    }
    
    var kpssStat = sumS2 / (kpssN * sigma2);
    
    // Critical values: 95%: 0.463, 99%: 0.573
    var kpssPvalue = 0.01;
    if (kpssStat < 0.463) {
      kpssPvalue = 0.10;
    } else if (kpssStat < 0.573) {
      kpssPvalue = 0.05;
    }
    
    var kpssConclusion = kpssStat > 0.463 ? '拒绝H0 (序列不平稳)' : '不拒绝H0 (序列平稳)';
    
    // Comprehensive conclusion
    var adfStable = adfStat < cv95;
    var kpssStable = kpssStat <= 0.463;
    var overall = adfStable && kpssStable ? '平稳' : (!adfStable && !kpssStable ? '不平稳' : '需差分');
    
    var result = 'ADF 统计量: ' + adfStat.toFixed(3) + '\nADF p值: ' + adfPvalue.toFixed(3) + '\nADF 结论: ' + adfConclusion + '\n\n' +
                 'KPSS LM: ' + kpssStat.toFixed(3) + '\nKPSS p值: ' + kpssPvalue.toFixed(3) + '\nKPSS 结论: ' + kpssConclusion + '\n\n' +
                 '综合: ' + overall;
    
    document.getElementById('resultValue').textContent = result;
    document.getElementById('resultBox').classList.add('show');
  }
  
  function transpose(m) {
    var rows = m.length, cols = m[0].length;
    var result = [];
    for (var j = 0; j < cols; j++) {
      result.push([]);
      for (var i = 0; i < rows; i++) {
        result[j].push(m[i][j]);
      }
    }
    return result;
  }
  
  function matMult(a, b) {
    var rowsA = a.length, colsA = a[0].length;
    var colsB = b[0].length;
    var result = [];
    for (var i = 0; i < rowsA; i++) {
      result.push([]);
      for (var j = 0; j < colsB; j++) {
        var sum = 0;
        for (var k = 0; k < colsA; k++) {
          sum += a[i][k] * b[k][j];
        }
        result[i].push(sum);
      }
    }
    return result;
  }
  
  function matVecMult(a, v) {
    var result = [];
    for (var i = 0; i < a.length; i++) {
      var sum = 0;
      for (var j = 0; j < v.length; j++) {
        sum += a[i][j] * v[j];
      }
      result.push(sum);
    }
    return result;
  }
  
  function invertMatrix(m) {
    var n = m.length;
    var aug = [];
    for (var i = 0; i < n; i++) {
      aug.push([]);
      for (var j = 0; j < 2 * n; j++) {
        aug[i].push(j < n ? m[i][j] : (j === i + n ? 1 : 0));
      }
    }
    for (var i = 0; i < n; i++) {
      var maxRow = i;
      for (var k = i + 1; k < n; k++) {
        if (Math.abs(aug[k][i]) > Math.abs(aug[maxRow][i])) maxRow = k;
      }
      var tmp = aug[i]; aug[i] = aug[maxRow]; aug[maxRow] = tmp;
      var pivot = aug[i][i];
      if (Math.abs(pivot) < 1e-12) continue;
      for (var j = 0; j < 2 * n; j++) aug[i][j] /= pivot;
      for (var k = 0; k < n; k++) {
        if (k !== i) {
          var factor = aug[k][i];
          for (var j = 0; j < 2 * n; j++) aug[k][j] -= factor * aug[i][j];
        }
      }
    }
    var inv = [];
    for (var i = 0; i < n; i++) {
      inv.push(aug[i].slice(n));
    }
    return inv;
  }
  </script>
</body>
