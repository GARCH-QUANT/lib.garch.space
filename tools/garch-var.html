<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>② GARCH-VaR/CVaR 风险价值计算器 | GARCH ToolBox</title>
  <meta name="description" content="GARCH(1,1) 条件方差估计，计算单资产/组合 VaR 与 CVaR">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/style.css">
</head>
<body>
  <header class="site-nav">
    <div class="nav-inner">
      <a href="/" class="nav-logo">
        <span class="logo-icon">Σ</span>
        <span class="logo-text">GARCH <span class="logo-accent">ToolBox</span></span>
      </a>
      <nav class="nav-links">
        <a href="/" class="nav-link">首页</a>
        <a href="/tools/" class="nav-link active">工具列表</a>
        <button class="theme-toggle" id="themeToggle" aria-label="切换主题"><span class="theme-icon">◐</span></button>
      </nav>
    </div>
  </header>

  <main class="tool-page">
    <div class="tool-page-header">
      <h1 class="tool-page-title">② GARCH-VaR/CVaR 风险价值计算器</h1>
      <p class="tool-page-sub">GARCH(1,1) 条件方差估计，计算单资产/组合 VaR 与 CVaR</p>
    </div>
    <div class="tool-form">
      <div class="form-grid">
        <div class="form-group">
          <label class="form-label">置信水平</label>
          <input type="text" class="form-input" id="param1" value="0.95" placeholder="0.95 或 0.99">
        </div>
        <div class="form-group">
          <label class="form-label">持有期 (天)</label>
          <input type="text" class="form-input" id="param2" value="1" placeholder="1">
        </div>
        <div class="form-group">
          <label class="form-label">GARCH ω</label>
          <input type="text" class="form-input" id="param3" value="0.000003" placeholder="0.000003">
        </div>
        <div class="form-group">
          <label class="form-label">GARCH α</label>
          <input type="text" class="form-input" id="param4" value="0.07" placeholder="0.07">
        </div>
        <div class="form-group">
          <label class="form-label">GARCH β</label>
          <input type="text" class="form-input" id="param5" value="0.92" placeholder="0.92">
        </div>
        <div class="form-group full">
          <label class="form-label">日收益率序列 (逗号分隔)</label>
          <textarea class="form-textarea" id="dataInput" placeholder="0.01,-0.02,0.015,...">0.012,-0.008,0.015,-0.005,0.020</textarea>
        </div>
      </div>
      <button class="btn-calc" onclick="calculate()">运行计算</button>
      <div class="result-box" id="resultBox">
        <div class="result-label">计算结果</div>
        <div class="result-value" id="resultValue">—</div>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p class="footer-copy">© 2026 GARCH QUANT | Quantitative Financial Tool Platform</p>
      <p class="footer-author">Fuli Yang, Ph.D.</p>
    </div>
  </footer>
  <script src="/assets/js/theme.js"></script>
  <script>
  function calculate() {
    try {
    var conf = parseFloat(document.getElementById('param1').value) || 0.95;
    var N = parseInt(document.getElementById('param2').value) || 1;
    var omega = parseFloat(document.getElementById('param3').value) || 0.000003;
    var alpha = parseFloat(document.getElementById('param4').value) || 0.07;
    var beta = parseFloat(document.getElementById('param5') ? document.getElementById('param5').value : '') || 0.92;
    var dataStr = document.getElementById('dataInput').value;

    var returns = dataStr.split(',').map(function(s) { return parseFloat(s.trim()); });

    if (returns.length === 0 || returns.some(isNaN)) {
      document.getElementById('resultValue').textContent = '请输入有效的收益率数据';
      document.getElementById('resultBox').classList.add('show');
      return;
    }

    var n = returns.length;
    var sum = 0;
    for (var i = 0; i < n; i++) { sum += returns[i]; }
    var mean = sum / n;

    var sqDiffSum = 0;
    for (var i = 0; i < n; i++) { sqDiffSum += Math.pow(returns[i] - mean, 2); }
    var stdDev = Math.sqrt(sqDiffSum / n);

    // 验证 GARCH 参数稳定性
    if (alpha + beta >= 1) {
      document.getElementById('resultValue').textContent = '参数错误: α+β必须<1以保证平稳性';
      document.getElementById('resultBox').classList.add('show');
      return;
    }

    // 长期无条件方差（用样本方差校准omega使长期与样本一致）
    var sampleVar = sqDiffSum / (n - 1);
    var estOmega = sampleVar * (1 - alpha - beta);
    omega = Math.max(estOmega, 1e-8);

    // 递推条件方差
    var h = sampleVar;
    for (var i = 0; i < n; i++) {
      var r = returns[i];
      h = omega + alpha * r * r + beta * h;
    }
    var condVar = h;
    var condVolDaily = Math.sqrt(condVar);

    // 正态分位数
    var zScore = (conf >= 0.99) ? 2.326 : (conf >= 0.975 ? 1.96 : 1.645);

    // VaR（日频，持仓=1）
    var dailyVaR = -zScore * condVolDaily;
    var nDayVaR = dailyVaR * Math.sqrt(N);

    // CVaR：E[L|L>VaR]，正态假设下 CVaR = VaR * (1 + exp(-z^2/2) / ((1-conf)*z*sqrt(2π)))
    var normalPdf = Math.exp(-0.5 * zScore * zScore) / Math.sqrt(2 * Math.PI);
    var cvarFactor = (1 / (1 - conf)) * normalPdf / zScore;
    var dailyCVaR = dailyVaR * (1 + cvarFactor);
    var nDayCVaR = nDayVaR * (1 + cvarFactor);

    // 年化条件波动率
    var annualizedVol = condVolDaily * Math.sqrt(252) * 100;
    var confPct = Math.round(conf * 100);

    var lines = [];
    lines.push('条件波动率(年化): ' + annualizedVol.toFixed(2) + '%');
    lines.push('日 VaR (' + confPct + '%): ' + (dailyVaR * 100).toFixed(2) + '%');
    lines.push('日 CVaR (' + confPct + '%): ' + (dailyCVaR * 100).toFixed(2) + '%');
    lines.push(N + '天 VaR: ' + (nDayVaR * 100).toFixed(2) + '%');
    lines.push(N + '天 CVaR: ' + (nDayCVaR * 100).toFixed(2) + '%');

    document.getElementById('resultValue').textContent = lines.join('\n');
    document.getElementById('resultBox').classList.add('show');
    } catch (e) {
    document.getElementById('resultValue').textContent = '错误: ' + e.message;
    document.getElementById('resultBox').classList.add('show');
  }
  }
  </script>
</body>
</html>
