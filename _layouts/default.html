---
layout: nil
---
<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {% if page.title %}<title>{{ page.title }} | {{ site.title }}</title>{% else %}<title>{{ site.title }}</title>{% endif %}
  {% seo %}
  <link rel="canonical" href="{{ page.url | absolute_url }}">
  <link href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/copy-tex.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}?v={{ site.time | date: '%s' }}">
  <link rel="preload" href="{{ '/assets/css/main.css' | relative_url }}?v={{ site.time | date: '%s' }}" as="style">
  <link rel="icon" type="image/svg+xml" href="{{ '/assets/img/favicon.svg' | relative_url }}">
</head>
<body class="wrap">
  <!-- Mobile hamburger button — visible only ≤ 768px -->
  <button class="hamburger-btn" id="hamburger-btn" aria-label="打开导航菜单" aria-expanded="false">
    <span class="hamburger-icon">
      <span></span><span></span><span></span>
    </span>
  </button>

  <!-- Mobile overlay backdrop — hidden by default -->
  <div class="sidebar-overlay" id="sidebar-overlay"></div>

  <div class="site-wrapper">
    {% include sidebar.html %}
    <main class="main-content" id="main-content">
      <div class="content-wrapper">
        {{ content }}
      </div>
    </main>
  </div>
  {% include footer.html %}
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/copy-tex.min.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", function() {
      renderMathInElement(document.body, {
        delimiters: [
          {left: '$$', right: '$$', display: true},
          {left: '$', right: '$', display: false},
          {left: '\\[', right: '\\]', display: true},
          {left: '\\(', right: '\\)', display: false}
        ],
        throwOnError: false
      });
    });
  </script>
  {% if page.search == "exclude" %}{% else %}{% include search.html %}{% endif %}
  <script>
    // ── Mobile hamburger navigation ──────────────────────────────────────
    (function () {
      var btn    = document.getElementById('hamburger-btn');
      var sidebar = document.getElementById('sidebar');
      var overlay = document.getElementById('sidebar-overlay');

      if (!btn || !sidebar || !overlay) return;

      function openMenu() {
        sidebar.classList.add('active');
        sidebar.classList.remove('sidebar-open');
        overlay.classList.add('overlay-visible');
        btn.setAttribute('aria-expanded', 'true');
        btn.classList.add('is-open');
        document.body.classList.add('nav-open');
      }
      function closeMenu() {
        sidebar.classList.remove('active');
        sidebar.classList.remove('sidebar-open');
        overlay.classList.remove('overlay-visible');
        overlay.style.display = 'none';
        btn.setAttribute('aria-expanded', 'false');
        btn.classList.remove('is-open');
        document.body.classList.remove('nav-open');
      }
      function resetOverlay() { overlay.style.display = 'none'; }

      btn.addEventListener('click', function () {
        var isOpen = sidebar.classList.contains('active') || sidebar.classList.contains('sidebar-open');
        isOpen ? closeMenu() : openMenu();
      });
      overlay.addEventListener('click', closeMenu);

      // Close on Escape
      document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape') closeMenu();
      });
    })();
  </script>
</body>
</html>
